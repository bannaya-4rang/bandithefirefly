<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>About</title><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;500;700&family=Patrick+Hand&display=swap"><style>
:root{--paper:#FFFFFF;--fill:#EBEBEB;--ink:#000000;--mute:#7A7A7A;--dim:#B5B5B5;
  --ui:"Noto Sans","DejaVu Sans","Helvetica Neue",Arial,sans-serif;--hand:"Patrick Hand","Comic Sans MS",cursive}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--ui);font-size:16px;line-height:1.5}
a{color:inherit;text-decoration:none}
a:focus-visible{outline:2px solid var(--ink);outline-offset:3px}
img{display:block;max-width:100%}
.wob{filter:url(#wobble)}
.box{background:var(--fill);border:2px solid var(--ink)}

/* ---- top: the VN scene ---- */
.scene{position:relative;background:#000;color:#fff;overflow:hidden}
.scene img{width:100%;height:auto}
.scene .dlg{position:relative;padding:12px 2% 3%;background:#000;margin-top:-2%}
.namebox{display:inline-block;background:var(--fill);color:var(--ink);border:2px solid var(--ink);padding:6px 40px;font-size:clamp(16px,1.8vw,26px);margin:0 0 -2px 6%;position:relative;z-index:2}
.textbox{background:var(--fill);color:var(--ink);border:2px solid var(--ink);padding:clamp(14px,2.4vw,32px) 20% clamp(20px,3vw,40px);font-size:clamp(15px,1.7vw,24px);line-height:1.45;min-height:0}
.textbox b{font-weight:700}
.vnmenu{display:flex;gap:clamp(10px,2.4vw,34px);justify-content:center;flex-wrap:wrap;padding:6px 0 10px;font-size:clamp(11px,1.15vw,16px);color:var(--dim)}
.vnmenu a[aria-current]{color:#fff}
.vnmenu a:hover{color:#fff}

/* ---- hallway nav ---- */
.hall{position:relative;border-top:2px solid var(--ink);border-bottom:2px solid var(--ink)}
.hall img{width:100%}
.hot{position:absolute;display:block}
.hot .e{position:absolute;left:50%;top:-14%;transform:translateX(-50%);width:clamp(34px,5vw,64px);height:clamp(34px,5vw,64px);border-radius:50%;background:#fff;border:3px solid #8a8a8a;display:grid;place-items:center;font-weight:700;font-size:clamp(16px,2.4vw,30px);opacity:0;transition:opacity .15s}
.hot .e::after{content:"";position:absolute;left:30%;bottom:-16px;border:9px solid transparent;border-top-color:#8a8a8a}
.hot .lbl{position:absolute;left:50%;bottom:-10%;transform:translateX(-50%);font-family:var(--hand);font-size:clamp(14px,1.8vw,24px);background:#fff;border:2px solid var(--ink);padding:2px 12px;white-space:nowrap}
.hot:hover .e,.hot:focus-visible .e{opacity:1}
.hint{position:absolute;left:2%;top:3%;font-family:var(--hand);font-size:clamp(13px,1.5vw,20px);color:var(--mute)}

/* ---- rooms ---- */
.room{padding:clamp(28px,5vw,72px) clamp(20px,5vw,72px);border-bottom:2px solid var(--ink)}
.room h2{font-family:var(--hand);font-weight:400;font-size:clamp(28px,4vw,52px);margin:0 0 18px;line-height:1}
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:clamp(20px,4vw,56px);align-items:center}
.frame{background:var(--fill);border:2px solid var(--ink);padding:clamp(10px,1.6vw,22px)}
.frame img{width:100%;aspect-ratio:1;object-fit:cover;border:2px solid var(--ink)}
.frame figcaption{font-family:var(--hand);margin-top:8px;color:var(--mute)}
.say{background:var(--fill);border:2px solid var(--ink);padding:18px 22px;font-size:clamp(15px,1.4vw,19px);line-height:1.5;position:relative;margin-top:14px}
.say .who{position:absolute;top:-16px;left:18px;background:var(--fill);border:2px solid var(--ink);padding:0 14px;font-size:14px}
.btn{display:inline-block;margin-top:16px;border:2px solid var(--ink);background:#fff;padding:8px 18px;font-family:var(--hand);font-size:18px}
.btn:hover{background:var(--fill)}

/* lockers = games */
.lockers{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:0;border:2px solid var(--ink);background:#fff}
.locker{border-right:2px solid var(--ink);padding:18px 18px 22px;min-height:240px;display:flex;flex-direction:column;gap:6px;background:var(--fill)}
.locker:last-child{border-right:0}
.locker .num{font-family:var(--hand);font-size:22px}
.locker h3{margin:6px 0 0;font-size:17px;font-weight:700}
.locker .meta{font-size:12.5px;color:var(--mute)}
.locker p{margin:4px 0 0;font-size:14px}
.locker .tag{margin-top:auto;font-family:var(--hand);font-size:15px;border:2px solid var(--ink);background:#fff;padding:2px 10px;align-self:flex-start}

/* seeds = sky */
.sky{position:relative;background:#000;color:#fff;border-bottom:2px solid var(--ink)}
.sky img{width:100%;opacity:.95}
.sky .over{position:absolute;inset:0;display:flex;align-items:flex-start;padding:clamp(20px,5vw,72px)}
.sky .over > div{background:rgba(0,0,0,.82);padding:18px 22px 22px;max-width:56ch}
.sky h2{font-family:var(--hand);font-weight:400;font-size:clamp(28px,4vw,52px);margin:0 0 10px;line-height:1}
.sky p{max-width:48ch;color:#ddd;margin:0}
.sky .btn{background:#000;color:#fff;border-color:#fff}

/* poster = about */
.poster{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:clamp(20px,4vw,56px);align-items:center}
.poster img{border:2px solid var(--ink)}
footer{padding:14px clamp(20px,5vw,72px) 26px;color:var(--dim);font-size:12px;display:flex;justify-content:space-between;flex-wrap:wrap;gap:10px}
@media (max-width:820px){.two,.poster{grid-template-columns:1fr}.textbox{padding-inline:6%}.namebox{margin-left:3%}}
</style><style>
.topnav{position:fixed;top:0;left:0;right:0;z-index:50;background:#000;display:flex;justify-content:center;gap:clamp(14px,3vw,40px);padding:12px 16px;font-size:clamp(13px,1.2vw,17px);color:var(--dim);border-bottom:2px solid #000}
.topnav a[aria-current]{color:#fff;font-weight:700}
.topnav a:hover{color:#fff}
body{padding-top:48px}
html{scroll-padding-top:56px}
</style>
<style>
/* large screens: cap the hero image/video height, centered, never cropped */
.scene>img,.scene>video{display:block;width:auto!important;max-width:100%;max-height:62vh;height:auto;margin:0 auto;object-fit:contain}
.scene .dlg{max-width:1180px;margin-left:auto;margin-right:auto;background:transparent}
@media (min-width:1400px){.scene>img,.scene>video{max-height:56vh}}
@media (max-width:820px){.scene>img,.scene>video{width:100%!important;max-height:none}}
</style>
</head>

<section class="scene" style="background:#000"><img src="img/island.png" alt="A floating island with a sign reading Do NOT Enter, under construction" style="width:100%"><div class="dlg"><div class="namebox wob">Bandi</div><div class="textbox wob">There will be a short introduction here, and a résumé. <b>Under construction, like most things around here.</b></div></div></section>
<footer><span>bandithefirefly.com</span><span>반디 · firefly</span></footer></body></html>
